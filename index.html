<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14201a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trail Targets">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.png">
<title>Trail Targets</title>
<style>
:root{--bg:#14201a;--card:#1e2e25;--fg:#e8efe9;--mute:#9db3a4;--acc:#f5a623;--line:#2f4538}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px 90px}
header{display:flex;align-items:center;gap:10px;padding:14px 0}header img{width:40px;height:40px;border-radius:10px}h1{font-size:22px;margin:0;flex:1}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.seg button{border-radius:0}.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.seg button{border:0}.seg button.on{background:var(--acc);color:#1a1a1a;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.card.done{opacity:.65}
.card h3{margin:0 0 4px;font-size:17px}.meta{color:var(--mute);font-size:14px}.notes{font-size:14px;margin-top:6px;white-space:pre-wrap}
.diff{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:700;margin-right:6px}
.Green{background:#2e9e4f}.Blue{background:#2d6fd6}.Black{background:#000;border:1px solid #666}.DoubleBlack{background:#000;border:1px solid var(--acc)}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{padding:6px 10px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1a1a1a;font-size:30px;border:0}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:min(94vw,480px)}dialog label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
dialog input,dialog select,dialog textarea{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.empty{color:var(--mute);text-align:center;padding:30px}
footer{display:flex;gap:6px;margin-top:20px}
</style></head><body>
<header><img src="icon-192.png" alt=""><h1>Trail Targets</h1><span class="meta" id="count"></span></header>
<div class="bar"><div class="seg" id="filt"><button data-f="todo" class="on">To Do</button><button data-f="done">Done</button><button data-f="all">All</button></div>
<select id="sort"><option value="name">Name</option><option value="diff">Difficulty</option><option value="dist">Distance</option><option value="elev">Elevation</option><option value="added">Newest</option><option value="doneDate">Date done</option></select></div>
<div id="list"></div>
<footer><button id="exp">Export JSON</button><button id="impB">Import JSON</button><input type="file" id="imp" accept="application/json" hidden></footer>
<button class="fab" id="add" aria-label="Add ride">+</button>
<dialog id="dlg"><form method="dialog" id="frm"><h3 id="dt">Add ride</h3>
<label>Ride name<input name="name" required></label><label>Trail / location<input name="loc"></label>
<label>Difficulty<select name="diff"><option>Green</option><option>Blue</option><option>Black</option><option>Double Black</option></select></label>
<div class="row"><label>Distance (mi)<input name="dist" type="number" step="0.1" min="0"></label><label>Elev. gain (ft)<input name="elev" type="number" step="1" min="0"></label></div>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<div class="row" style="margin-top:12px"><button value="cancel" formnovalidate>Cancel</button><button value="ok" style="background:var(--acc);color:#1a1a1a;font-weight:600">Save</button></div></form></dialog>
<script>
const K='trailTargets.v2',D=['Green','Blue','Black','Double Black'],$=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const SEED=[
["Johnson Ranch","Johnson Ranch loop (SLO & Five Cities)","Green","2.5–4","300","Mellow beginner loop off S. Higuera — good warm-up or ride with the kids."],
["Madonna (Cerro San Luis)","Fire road + Lemon Grove singletrack (SLO & Five Cities)","Blue","4–6","1,100","Steady fire-road climb with big views over town; singletrack descent."],
["Irish Hills","Froom Ranch, Mariposa, Bog Thistle, Ridge trails (SLO & Five Cities)","Black","5–9","1,200–1,800","Steep, loose climbs from Madonna Rd / Prefumo Canyon trailheads."],
["Sycamore Springs / Ontario Ridge","Fire road up, singletrack over to Shell Beach (SLO & Five Cities)","Black","5–7","1,200","Short, punchy climb up Ontario Ridge with ocean views; ridge singletrack to Shell Beach."],
["Pismo Preserve","Discovery Loop + ridge trails (SLO & Five Cities)","Blue","4–10","800–1,500","~10 mi open to bikes (Vamonos is hike-only). Closes when muddy."],
["Lopez Lake","Duna Vista, Two Waters, Blackberry Spring, Turkey Ridge (SLO & Five Cities)","Blue","5–10","800–1,500","County park, day-use fee. Hot in summer — go early."],
["West Cuesta Ridge","Shooters, Morning Glory/Botanicals, Firebreak, Pick & Shovel, Chrome, Moto, Powerlines (SLO & Five Cities)","Black","8–15","1,500–2,500","The local classic. Paved/fire-road climb, steep technical descents. Can link to Cerro Alto."],
["East Cuesta Ridge","Fire road (Upper Lopez Canyon trail at ~6 mi is hiking only) (SLO & Five Cities)","Blue","10–12 (out & back)","2,000","Non-technical but a real fitness climb. Turn around where the hike-only trail starts."],
["Montaña de Oro","Horse Camp, East Boundary, Islay Creek fire rd, Barranca, Canyon View, Hazard Peak, Oats Peak, Beebe, Manzanita (SLO & Five Cities)","Black","6–15","1,000–2,500","Huge variety. Islay Creek is easy; Hazard/Oats Peak climbs and Manzanita are the hard stuff."],
["Cerro Cabrillo (Morro Bay SP)","Quarry, Canet, Live Oak, Park Ridge (SLO & Five Cities)","Blue","5–8","900","Flowy loops below the Morros near the Morro Bay golf course."],
["Estero Bluffs","Coastal bluff trail (North County & Coast)","Green","3–4","~100","Flat ocean-bluff cruise north of Cayucos."],
["Whale Rock Reservoir","Reservoir roads & trail (North County & Coast)","Green","~4","300","City-owned; public access is limited (fishing-season hours). Check SLO City before going."],
["Cayucos Hills","Hills above the cemetery (bike up past the house) (North County & Coast)","Blue","5–8","1,000+","Informal access per your sheet — confirm it's not private land before riding."],
["Cambria","Climb to the rock above Coast Union HS (North County & Coast)","Blue","3–5","700","Short local climb with coast views."],
["San Simeon Campground","Road + singletrack (North County & Coast)","Green","3–5","200","Easy mix of campground roads and creekside singletrack."],
["Cerro Alto (Hwy 41)","Cerro Alto loop / Boy Scout / West Cuesta link (North County & Coast)","Black","7–10","2,000","Steep climb, rocky techy descent. Day-use fee at the campground."],
["Three Bridges (Hwy 41)","Lower Three Bridges (upper portion no bikes) (North County & Coast)","Black","~6","1,200","Creek crossings; upper section is closed to bikes."],
["Stadium Park (Atascadero)","Stadium Park trails (North County & Coast)","Blue","2–4","600","Short, steep and a bit techy — right in town."],
["Rocky Canyon (Atascadero)","Fire road to the top, road to Creston (North County & Coast)","Blue","8–12","1,500","Fire-road climb. From the top, roll the road to Creston for a milkshake."],
["Santa Margarita Lake — North","Blinn Ranch → Sandstone, Sapwi, Falcon (River Rd TH) (North County & Coast)","Blue","8–14","1,200","Quieter north-shore singletrack from the River Road trailhead."],
["Santa Margarita Lake — South","Rocky, Grey Pine, Vaca Flats, secret trail to slick-rock overlook (North County & Coast)","Blue","6–10","1,000","Main park entrance; day-use fee. Hot and exposed mid-day."],
["Rinconada","Short interwoven loops · Long route: High Mtn Lookout Rd → Big Falls → Belmont Stakes → Deliverance (North County & Coast)","Double Black","3–6 (loops) · ~20 (long route)","500 · 3,500+","Short fun trails from the Rinconada TH; the long route is a big backcountry day — see your sheet for turn-by-turn."],
["Pozo","Turkey Flats, Tower, Black Mountain Rd, Howard Bypass (sketchy), Fernandez (overgrown) (North County & Coast)","Black","10–20","2,500+","Shared with motos (OHV). Loose, steep, remote — bring water & a buddy."],
["Caliente Mountain Ridge Trail","Ridge road to Caliente Mtn (Carrizo Plain) (North County & Coast)","Black","~17 (out & back)","2,500","Remote, no water, 4WD recommended to the trailhead. Pin is approximate."],
["Prewitt Ridge Downhill","Hwy 1 → Nacimiento-Fergusson → South Coast Ridge Rd → Prewitt descent (Big Sur & Monterey)","Double Black","~20 loop","3,500","Park at USFS Pacific Valley station. Full directions on your sheet. Big Sur cliffs — serious."],
["Willett-Plaskett","Fire-road ascent near Ragged Point / Plaskett Ridge (Big Sur & Monterey)","Black","15–20","3,000","Pin at Plaskett Ridge Rd; your sheet says the fire road starts ~500 ft before Ragged Point — confirm start."],
["Arroyo Seco","Indians Rd / Arroyo Seco fire roads (Big Sur & Monterey)","Black","10–20","2,500","Los Padres NF west of Greenfield. Remote, rough roads."],
["Toro Park (Pipeline)","Pipeline + ridge loops (Big Sur & Monterey)","Blue","8–12","1,500","County park off Hwy 68; connects into Fort Ord. Parking fee."],
["Fort Ord National Monument","80+ mi of singletrack & fire road (Sea Otter country) (Big Sur & Monterey)","Blue","10–25","800–1,500","Endless rolling singletrack. Creekside Terrace / Badger Hills trailheads off Hwy 68."],
["Mudstone Ranch (Hollister Hills)","Road Runner, Razorback, Old Ranch Rd (Big Sur & Monterey)","Blue","5–13","700","Non-motorized section of Hollister Hills SVRA, Cienega Rd."],
["Orcutt Hills / Santa Maria Open Space","Rice Ranch / Orcutt Hills trails (Santa Maria · Santa Ynez · SB)","Blue","5–8","800","Rolling oak hills above Orcutt."],
["Los Flores Ranch","Los Flores Ranch Park trails (Santa Maria · Santa Ynez · SB)","Blue","5–8","900","City park east of Santa Maria — check hours before going."],
["New Cuyama: Aliso ↑ McPherson ↓","Up Aliso, down McPherson from Aliso Park Campground (Santa Maria · Santa Ynez · SB)","Black","~17 loop","3,500","Big climb to Sierra Madre ridge, long descent. Very hot in summer."],
["San Rafael / Figueroa Mtn","McKinley Rd, White Rock, Davy Brown Trail (overgrown) (Santa Maria · Santa Ynez · SB)","Black","10–20","2,500+","Stay out of the Wilderness boundary (no bikes). Davy Brown is overgrown."],
["Gaviota Peak Road","Trespass Trail, Tunnel View Trail (Santa Maria · Santa Ynez · SB)","Black","6–9","2,000","Steep fire road with ocean views from Gaviota SP."],
["Baron Ranch","Loop trail (+ Arroyo Quemado to Camino Cielo) (Santa Maria · Santa Ynez · SB)","Blue","~6 loop","1,100","Open daily 8 am–sunset, off Hwy 101 west of Goleta."],
["Paradise Road (Santa Ynez River)","Snyder, Aliso Canyon, Oso Connector, Camuesa Rd/Connector, Santa Cruz Trail, 19 Oaks, Arroyo Burro (N) (Santa Maria · Santa Ynez · SB)","Black","10–25","2,000–4,000","Lots of options off Paradise Rd; creek crossings after rain. Adventure Pass needed to park."],
["Santa Barbara Front Side","Jesusita, Arroyo Burro Frontside, Tunnel, Rattlesnake, Romero Canyon (Santa Maria · Santa Ynez · SB)","Double Black","6–12","2,000–3,000","Rocky, very technical, busy with hikers — go weekdays and check current bike access per trail."]];
let rides=load(),filt='todo',editId=null;
function load(){try{const r=JSON.parse(localStorage.getItem(K));if(Array.isArray(r))return r}catch(e){}return SEED.map((s,i)=>({id:uid()+i,name:s[0],loc:s[1],diff:s[2],dist:s[3],elev:s[4],notes:s[5],done:false,doneDate:null,added:Date.now()-i}))}
function save(){localStorage.setItem(K,JSON.stringify(rides))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const s=$('#sort').value;let v=rides.filter(r=>filt==='all'||(filt==='done')===!!r.done);
const n=x=>x==null||x===''?Infinity:+x;
v.sort({name:(a,b)=>a.name.localeCompare(b.name),diff:(a,b)=>D.indexOf(a.diff)-D.indexOf(b.diff),dist:(a,b)=>n(a.dist)-n(b.dist),elev:(a,b)=>n(a.elev)-n(b.elev),added:(a,b)=>b.added-a.added,doneDate:(a,b)=>(b.doneDate||'').localeCompare(a.doneDate||'')}[s]);
$('#count').textContent=rides.filter(r=>r.done).length+'/'+rides.length+' done';
$('#list').innerHTML=v.length?v.map(r=>`<div class="card ${r.done?'done':''}"><h3>${r.done?'✅ ':''}${esc(r.name)}</h3>
<div class="meta"><span class="diff ${r.diff.replace(' ','')}">${esc(r.diff)}</span>${esc(r.loc)}</div>
<div class="meta">${r.dist!=null&&r.dist!==''?r.dist+' mi':''}${r.elev!=null&&r.elev!==''?' · '+r.elev+' ft':''}${r.done?' · Done '+esc(r.doneDate):''}</div>
${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}
<div class="acts"><button data-a="tog" data-id="${r.id}">${r.done?'Undo':'Mark done'}</button><button data-a="ed" data-id="${r.id}">Edit</button><button data-a="del" data-id="${r.id}">Delete</button></div></div>`).join(''):'<div class="empty">No rides here yet.</div>'}
$('#filt').onclick=e=>{const f=e.target.dataset.f;if(!f)return;filt=f;[...$('#filt').children].forEach(b=>b.classList.toggle('on',b.dataset.f===f));render()};
$('#sort').onchange=render;
$('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=rides.find(x=>x.id===b.dataset.id);
if(b.dataset.a==='tog'){if(r.done){r.done=false;r.doneDate=null}else{const d=prompt('Date ridden (YYYY-MM-DD):',new Date().toLocaleDateString('en-CA'));if(d===null)return;r.done=true;r.doneDate=d}}
else if(b.dataset.a==='del'){if(!confirm('Delete "'+r.name+'"?'))return;rides=rides.filter(x=>x!==r)}
else{open(r);return}save();render()};
function open(r){editId=r?r.id:null;$('#dt').textContent=r?'Edit ride':'Add ride';const f=$('#frm');f.reset();if(r)['name','loc','diff','dist','elev','notes'].forEach(k=>f[k].value=r[k]??'');$('#dlg').showModal()}
$('#add').onclick=()=>open(null);
$('#dlg').addEventListener('close',()=>{if($('#dlg').returnValue!=='ok')return;const f=$('#frm'),o={name:f.name.value.trim(),loc:f.loc.value.trim(),diff:f.diff.value,dist:f.dist.value===''?null:+f.dist.value,elev:f.elev.value===''?null:+f.elev.value,notes:f.notes.value.trim()};if(!o.name)return;
if(editId)Object.assign(rides.find(x=>x.id===editId),o);else rides.push({id:uid(),...o,done:false,doneDate:null,added:Date.now()});save();render()});
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rides,null,2)],{type:'application/json'}));a.download='trail-targets-'+new Date().toLocaleDateString('en-CA')+'.json';a.click()};
$('#impB').onclick=()=>$('#imp').click();
$('#imp').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.every(r=>r&&r.name))throw 0;if(confirm('Replace your '+rides.length+' rides with '+d.length+' from backup?')){rides=d.map(r=>({id:r.id||uid(),diff:D.includes(r.diff)?r.diff:'Blue',added:r.added||Date.now(),done:!!r.done,doneDate:r.doneDate||null,loc:'',notes:'',dist:null,elev:null,...r}));save();render()}}catch(x){alert('Not a valid Trail Targets backup.')}e.target.value=''};
render();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('service-worker.js');
</script></body></html>
